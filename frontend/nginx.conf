server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  location /api/    { proxy_pass http://backend:8000; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; proxy_read_timeout 90s; }
  location /admin/  { proxy_pass http://backend:8000; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; }
  location /static/ { proxy_pass http://backend:8000; }

  location / { try_files $uri /index.html; }
}
